copyright: Copyright &copy; Zebbra AG
edit_uri: edit/release/2.0/docs
extra:
  social:
  - icon: fontawesome/solid/house
    link: https://zebbra.ch
    name: Zebbra
extra_css:
- assets/extra.css
extra_javascript:
- assets/extra.js
hooks:
- .make_scripts/mkdocs-documentation/hooks/inline_nav_include.py
- .make_scripts/mkdocs-documentation/hooks/fix_symlinks.py
- .make_scripts/mkdocs-documentation/hooks/submodule_authors.py
markdown_extensions:
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
      name: mermaid
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path:
    - !relative
    check_paths: true
    restrict_base_path: false
- pymdownx.emoji:
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
    emoji_index: !!python/name:material.extensions.emoji.twemoji
- pymdownx.tabbed:
    alternate_style: true
- attr_list
- md_in_html
- pymdownx.tasklist:
    custom_checkbox: true
- abbr
- smarty
- pymdownx.smartsymbols
- pymdownx.magiclink
- pymdownx.betterem
nav:
- Home: index.md
- Install: 10-install.md
- Scenarios: 20-scenarios.md
- Operations: 30-operations.md
- External proxy: 40-external-proxy.md
- Troubleshooting: 50-troubleshooting.md
plugins:
- search
- include_dir_to_nav
- document-dates:
    exclude:
    - coming-soon.md
    position: bottom
    type: datetime
- exclude:
    glob:
    - superpowers/*
repo_url: https://github.com/zebbra/neops-docker-compose
site_name: NeOps docker-compose
theme:
  custom_dir: docs/override
  favicon: assets/favicon.png
  features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - header.autohide
  - announce.dismiss
  - navigation.footer
  - navigation.indexes
  - navigation.sections
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.path
  - navigation.top
  - navigation.tracking
  - navigation.instant
  - search.share
  - search.suggest
  - search.highlight
  - content.action.edit
  - toc.follow
  logo: assets/logo.svg
  name: material
