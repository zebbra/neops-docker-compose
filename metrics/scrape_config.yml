global:
  scrape_interval: 30s

scrape_configs:
  - job_name: neops
    static_configs:
      # dev: backend running on host (works on Linux via extra_hosts: host-gateway)
      - targets: [host.docker.internal:8000]
      # prod: backend running as docker service
      # - targets: [backend:8000]
    metrics_path: /metrics

  - job_name: celery
    static_configs:
      - targets: [celery-exporter:9808]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: elasticsearch
    static_configs:
      - targets: [elasticsearch-exporter:9114]

  - job_name: victoriametrics
    static_configs:
      - targets: [victoriametrics:8428]

  - job_name: vmalert
    static_configs:
      - targets: [vmalert:8880]
