# Single-binary Loki for the e2e Loki scenario: filesystem storage, schema v13 on tsdb, which
# structured metadata needs. discover_service_name and discover_log_levels keep Loki's defaults
# on purpose: a customer's Loki injects service_name and detected_level, and the engine must
# drop both on read (LOKI_INGEST_KEYS), which this run proves.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
