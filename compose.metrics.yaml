# Overlay: VictoriaMetrics + vmalert + exporters, ported from the 1.0 layout, plus Grafana's
# metrics datasource and dashboards. Requires compose.grafana.yaml, listed before this file.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  celery-exporter:
    image: danihodovic/celery-exporter:0.11.3
    command: ["--broker-url=redis://redis:6379/0"]
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    logging: *logging
    restart: unless-stopped

  postgres-exporter-cms:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://neops:${NEOPS_CMS_DB_PASSWORD}@postgres-cms:5432/neops?sslmode=disable
    depends_on:
      postgres-cms:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  postgres-exporter-engine:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${NEOPS_ENGINE_DB_PASSWORD}@postgres-engine:5432/neops-workflow?sslmode=disable
    depends_on:
      postgres-engine:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.9.0
    command: ["--es.uri=http://elasticsearch:9200", "--es.all", "--es.indices"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.126.0
    command:
      - "--promscrape.config=/etc/victoriametrics/scrape_config.yml"
      - "--retentionPeriod=${NEOPS_METRICS_RETENTION:-30d}"
      - "--storageDataPath=/victoria-metrics-data"
    volumes:
      - ./metrics/scrape_config.yml:/etc/victoriametrics/scrape_config.yml:ro
      - ${NEOPS_DATA_DIR:-./data}/metrics/victoria:/victoria-metrics-data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8428/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  vmalert:
    image: victoriametrics/vmalert:v1.126.0
    command:
      - "--datasource.url=http://victoriametrics:8428"
      - "--remoteWrite.url=http://victoriametrics:8428"
      - "--remoteRead.url=http://victoriametrics:8428"
      - "--rule=/etc/vmalert/rules/*.yml"
      - "--evaluationInterval=1m"
      - "--notifier.blackhole=true"
    volumes:
      - ./metrics/vmalert/rules:/etc/vmalert/rules:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  # Everything down to `depends_on` repeats compose.grafana.yaml: the previous release's .env
  # names this file without that one, and check() loads that file list before migration 0003
  # can add it, so this block must start Grafana on its own. Compose merges the two copies.
  # Remove the repeated part in the release after the one that introduced compose.grafana.yaml.
  grafana:
    image: grafana/grafana:12.4.9
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${NEOPS_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${NEOPS_GRAFANA_URL:-http://localhost:3000}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ${NEOPS_DATA_DIR:-./data}/metrics/grafana:/var/lib/grafana
      - ./metrics/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./metrics/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "${NEOPS_BIND_ADDRESS:-127.0.0.1}:${NEOPS_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging: *logging
    restart: unless-stopped
    depends_on:
      victoriametrics:
        condition: service_healthy
