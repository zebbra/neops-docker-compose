services:
  redis:
    image: redis:7
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: unsafe
    ports:
      - "5433:5432"
    volumes:
      - ./data/dev_postgres:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"

  frontend:
    build: /home/sgr/code/neops-legacy-frontend
    environment:
      FRONTEND_NEOPS_URL: http://localhost:8000/graphql
    ports:
      - "8080:8080"
    restart: on-failure

  # ── Observability stack ────────────────────────────────────────────────────
  # Start with: docker compose --profile metrics up

  celery-exporter:
    profiles: [metrics]
    image: danihodovic/celery-exporter:latest
    command:
      - "--broker-url=redis://redis:6379/0"
    ports:
      - "9808:9808"
    depends_on:
      - redis
    restart: unless-stopped

  redis-exporter:
    profiles: [metrics]
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  postgres-exporter:
    profiles: [metrics]
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:unsafe@postgres:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    restart: unless-stopped

  elasticsearch-exporter:
    profiles: [metrics]
    image: prometheuscommunity/elasticsearch-exporter:latest
    command:
      - "--es.uri=http://elasticsearch:9200"
      - "--es.all"
      - "--es.indices"
    ports:
      - "9114:9114"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  vmalert:
    profiles: [metrics]
    image: victoriametrics/vmalert:latest
    command:
      - "--datasource.url=http://victoriametrics:8428"
      - "--remoteWrite.url=http://victoriametrics:8428"
      - "--remoteRead.url=http://victoriametrics:8428"
      - "--rule=/etc/vmalert/rules/*.yml"
      - "--evaluationInterval=1m"
      - "--notifier.blackhole=true"
    volumes:
      - ./metrics/vmalert/rules:/etc/vmalert/rules:ro
    ports:
      - "8880:8880"
    depends_on:
      - victoriametrics
    restart: unless-stopped

  victoriametrics:
    profiles: [metrics]
    image: victoriametrics/victoria-metrics:latest
    command:
      - "--promscrape.config=/etc/victoriametrics/scrape_config.yml"
      - "--retentionPeriod=30d"
      - "--storageDataPath=/victoria-metrics-data"
    volumes:
      - ./metrics/scrape_config.yml:/etc/victoriametrics/scrape_config.yml:ro
      - vm_data:/victoria-metrics-data
    ports:
      - "8428:8428"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    profiles: [metrics]
    image: grafana/grafana:11.5.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  vm_data:
    driver: local
  grafana_data:
    driver: local
